<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Analytics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e0e; color: #d4d4d4; font-family: 'Menlo', 'Monaco', monospace; font-size: 13px; }
  .header { padding: 16px 24px; border-bottom: 1px solid #1e1e1e; display: flex; align-items: center; gap: 12px; }
  .header-title { font-size: 13px; font-weight: 600; color: #c9a84c; }
  .header-sub { font-size: 11px; color: #444; }
  .layout { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 49px); }
  .sidebar { border-right: 1px solid #1e1e1e; padding: 16px; overflow-y: auto; }
  .sidebar-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .table-name { font-size: 12px; color: #c9a84c; margin-bottom: 6px; cursor: pointer; }
  .table-name:hover { color: #e8c46a; }
  .col-item { font-size: 11px; color: #555; padding: 2px 0 2px 12px; }
  .col-type { color: #333; margin-left: 6px; }
  .main { display: flex; flex-direction: column; }
  .editor-section { padding: 16px 24px; border-bottom: 1px solid #1e1e1e; }
  .editor-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .query-presets { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .preset-btn { font-size: 10px; color: #555; background: none; border: 1px solid #222; padding: 4px 10px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .preset-btn:hover { border-color: #c9a84c; color: #c9a84c; }
  textarea { width: 100%; background: #111; border: 1px solid #222; color: #d4d4d4; font-family: 'Menlo', 'Monaco', monospace; font-size: 13px; padding: 12px; resize: none; height: 100px; outline: none; }
  textarea:focus { border-color: #333; }
  .run-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .run-btn { background: #c9a84c; color: #0e0e0e; border: none; padding: 8px 20px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .run-btn:hover { background: #e8c46a; }
  .result-meta { font-size: 11px; color: #444; }
  .results-section { flex: 1; overflow: auto; padding: 16px 24px; }
  .error-msg { color: #e05a5a; font-size: 12px; padding: 12px; border: 1px solid #3a1a1a; background: #1a0a0a; }
  .results-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .results-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid #222; color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; white-space: nowrap; }
  .results-table td { padding: 8px 12px; border-bottom: 1px solid #161616; color: #888; }
  .results-table tr:hover td { background: #111; color: #d4d4d4; }
  .score-1 { color: #c9a84c; font-weight: 600; }
  .score-2 { color: #6a9fd4; }
  .score-3 { color: #444; }
  .empty-state { color: #333; font-size: 12px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">GTM Analytics</div>
    <div class="header-sub">job_history · SQLite · Ryan Carey</div>
  </div>
</div>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-label">Schema</div>
    <div id="schema-container"></div>
  </div>
  <div class="main">
    <div class="editor-section">
      <div class="editor-label">Query Editor</div>
      <div class="query-presets">
        <button class="preset-btn" onclick="setQuery('SELECT * FROM job_history ORDER BY score ASC LIMIT 20')">All Jobs</button>
        <button class="preset-btn" onclick="setQuery('SELECT * FROM job_history WHERE score = 1 ORDER BY funding DESC')">Tier 1 Only</button>
        <button class="preset-btn" onclick="setQuery('SELECT score, COUNT(*) as count FROM job_history GROUP BY score ORDER BY score')">Jobs by Tier</button>
        <button class="preset-btn" onclick="setQuery('SELECT location, COUNT(*) as count FROM job_history GROUP BY location ORDER BY count DESC LIMIT 10')">Top Locations</button>
        <button class="preset-btn" onclick="setQuery('SELECT score, ROUND(AVG(CAST(funding AS REAL)), 0) as avg_funding FROM job_history WHERE funding IS NOT NULL GROUP BY score ORDER BY score')">Avg Funding by Tier</button>
        <button class="preset-btn" onclick="setQuery('SELECT week, COUNT(*) as count FROM job_history GROUP BY week ORDER BY week DESC')">Jobs Per Week</button>
        <button class="preset-btn" onclick="setQuery('SELECT company, job_title, funding FROM job_history WHERE action = \'Apply Now\' ORDER BY funding DESC')">Apply Now</button>
      </div>
      <textarea id="query-input" placeholder="SELECT * FROM job_history LIMIT 10"></textarea>
      <div class="run-row">
        <button class="run-btn" onclick="runQuery()">Run Query</button>
        <span class="result-meta" id="result-meta"></span>
      </div>
    </div>
    <div class="results-section">
      <div id="results-container"><div class="empty-state">Run a query to see results</div></div>
    </div>
  </div>
</div>
<script>
  async function loadSchema() {
    const res = await fetch('/schema');
    const schema = await res.json();
    const container = document.getElementById('schema-container');
    container.innerHTML = Object.entries(schema).map(([table, cols]) => `
      <div class="table-name" onclick="setQuery('SELECT * FROM ${table} LIMIT 10')">${table}</div>
      ${cols.map((c) => `<div class="col-item">${c.name}<span class="col-type">${c.type}</span></div>`).join('')}
    `).join('');
  }

  function setQuery(sql) {
    document.getElementById('query-input').value = sql;
  }

  async function runQuery() {
    const sql = document.getElementById('query-input').value.trim();
    if (!sql) return;
    const start = Date.now();
    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql })
      });
      const data = await res.json();
      const elapsed = Date.now() - start;
      if (data.error) {
        document.getElementById('results-container').innerHTML = `<div class="error-msg">${data.error}</div>`;
        document.getElementById('result-meta').textContent = '';
        return;
      }
      document.getElementById('result-meta').textContent = `${data.count} rows · ${elapsed}ms`;
      if (data.rows.length === 0) {
        document.getElementById('results-container').innerHTML = '<div class="empty-state">No results returned</div>';
        return;
      }
      const headers = data.columns.map(c => `<th>${c}</th>`).join('');
      const rows = data.rows.map(row => {
        const cells = data.columns.map(col => {
          const val = row[col];
          let cls = '';
          if (col === 'score') {
            if (val == 1) cls = 'score-1';
            else if (val == 2) cls = 'score-2';
            else if (val == 3) cls = 'score-3';
          }
          return `<td class="${cls}">${val !== null && val !== undefined ? val : ''}</td>`;
        }).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
      document.getElementById('results-container').innerHTML = `<table class="results-table"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
    } catch (err) {
      document.getElementById('results-container').innerHTML = `<div class="error-msg">Request failed</div>`;
    }
  }

  document.getElementById('query-input').addEventListener('keydown', (e) => {
    if (e.metaKey && e.key === 'Enter') runQuery();
  });

  loadSchema();
</script>
</body>
</html>
